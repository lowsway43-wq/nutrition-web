name: NutriHealth CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nutrihealth-backend

    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, pdo_mysql, pdo_sqlite, sqlite3, xml, curl
          coverage: none

      - name: Periksa file Composer
        run: composer validate --no-check-publish

      - name: Pasang dependensi Laravel
        run: composer install --no-interaction --prefer-dist

      - name: Siapkan file environment pengujian
        run: cp .env.example .env

      - name: Buat application key
        run: php artisan key:generate

      - name: Jalankan pengujian Laravel
        run: php artisan test
